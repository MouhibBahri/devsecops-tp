apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-hardening
spec:
  background: true
  rules:
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["pygoat"]
      validate:
        failureAction: Enforce
        message: "Images must use an immutable tag or digest, never ':latest' or no tag."
        pattern:
          spec:
            containers:
              - image: "*:* & !*:latest"
    - name: require-hardened-security-context
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["pygoat"]
      validate:
        failureAction: Enforce
        message: "Pods must run as non-root, unprivileged, without privilege escalation, with a read-only root filesystem and all capabilities dropped."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
            containers:
              - securityContext:
                  =(privileged): false
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]