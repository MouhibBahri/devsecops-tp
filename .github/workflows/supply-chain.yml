name: Supply Chain Security (TP4)

on:
  push:
    branches: [ tp4-supply-chain-policy, 'test/**' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks version

      - name: Scan the whole git history
        run: ./gitleaks git . --redact --verbose
  iac-scan:
    name: iac-scan (Trivy config)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - name: Scan Kubernetes manifests (fail on HIGH/CRITICAL)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.76.2 config \
            --severity HIGH,CRITICAL --exit-code 1 /src/k8s