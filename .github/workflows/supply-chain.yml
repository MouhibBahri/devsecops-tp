name: Supply Chain Security (TP4)

on:
  push:
    branches: [ tp4-supply-chain-policy, 'test/**' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks version

      - name: Scan the whole git history
        run: ./gitleaks git . --redact --verbose

  iac-scan:
    name: iac-scan (Trivy config)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - name: Scan Kubernetes manifests (fail on HIGH/CRITICAL)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.76.2 config \
            --severity HIGH,CRITICAL --exit-code 1 /src/k8s

  build-sign:
    name: build, image scan, SBOM, sign
    runs-on: ubuntu-latest
    needs: iac-scan
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/mouhibbahri/pygoat
    steps:
      - uses: actions/checkout@v4

      - name: Install Syft and Cosign
        run: |
          curl -sSfL https://github.com/anchore/syft/releases/download/v1.57.2/syft_1.57.2_linux_amd64.tar.gz | sudo tar -xz -C /usr/local/bin syft
          sudo curl -sSfL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64
          sudo chmod +x /usr/local/bin/cosign

      - name: Build image
        run: docker build -t $IMAGE:${{ github.sha }} --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} .

      - name: Image scan - Trivy (fail on fixable CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 $IMAGE:${{ github.sha }}

      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $IMAGE:${{ github.sha }}
          REF=$(docker inspect --format '{{index .RepoDigests 0}}' $IMAGE:${{ github.sha }})
          echo "IMAGE_REF=$REF" >> $GITHUB_ENV
          echo "Signed image: \`$REF\`" >> $GITHUB_STEP_SUMMARY

      - name: SBOM - Syft (CycloneDX)
        run: syft $IMAGE_REF -o cyclonedx-json=sbom.cdx.json

      - name: Keep SBOM as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      - name: Sign image and attach SBOM - Cosign
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --yes --key env://COSIGN_KEY $IMAGE_REF
          cosign attest --yes --key env://COSIGN_KEY --type cyclonedx --predicate sbom.cdx.json $IMAGE_REF

      - name: Verify signature
        run: cosign verify --key cosign.pub $IMAGE_REF